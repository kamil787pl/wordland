<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WordLand – portal do nauki angielskiego</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1b2430;--fg:#f4f1ea;--card:#fffdf5;--ink:#1b2430;--gold:#f2b632;--ok:#2e9d4f;--bad:#d64545}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10161e}}
:root[data-theme="dark"]{--bg:#10161e}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:8px;touch-action:manipulation}
#wrap{position:relative;width:100%;max-width:960px}
canvas{width:100%;display:block;border:3px solid #0c1015;border-radius:6px;background:#7ec8f5;touch-action:none}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,14,20,.62);overflow:auto}
.ov.on{display:flex}
.card{background:var(--card);color:var(--ink);border-radius:12px;padding:16px 20px;width:min(94%,420px);text-align:center;border:3px solid var(--gold);max-height:100%;overflow:auto}
.card h1{margin:0;font-size:30px;letter-spacing:1px}
.card h2{margin:0 0 4px;font-size:16px}
.card p{margin:6px 0}
.q{font-size:32px;font-weight:700;margin:4px 0 10px}
.card button{display:block;width:100%;margin:7px 0;padding:11px;font:inherit;font-size:18px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.card button:hover:not(:disabled){background:#fff3c9}
.card button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.card button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.card button.g{display:inline-block;width:auto;padding:8px 14px;font-size:16px;background:var(--gold)}
.card button.lv{text-align:left;display:flex;justify-content:space-between}
details.grp{margin:8px 0;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
details.grp summary{display:flex;align-items:center;padding:10px 12px;cursor:pointer;font-size:16px;background:#fff3c9;list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::before{content:'▸';margin-right:8px;transition:transform .15s}
details.grp[open] summary::before{transform:rotate(90deg)}
details.grp summary span{font-size:13px;opacity:.8;margin-left:auto}
details.grp .lv{margin:0;border:0;border-top:1px solid #ddd;border-radius:0;font-size:17px}
.wl{font-size:14px;line-height:1.6;margin:8px 0}
.card input,.card textarea{width:100%;font:inherit;font-size:15px;padding:8px;border:2px solid var(--ink);border-radius:6px;margin:4px 0;color:var(--ink);background:#fff}
.ov.b{align-items:flex-end;background:transparent}
.ov.b .card{padding:10px 14px}
.ov.b .q{font-size:24px;margin:2px 0 6px}
.ov.b .card button{margin:4px 0;padding:7px;font-size:16px}
.ov.b .card button.g{padding:7px 12px}
.bar{height:10px;background:#ddd;border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.sba{min-height:36px;border:2px dashed var(--ink);border-radius:8px;margin:6px 0;padding:6px;font-size:18px}
.card button.o.t{display:inline-block;width:auto;margin:3px;padding:7px 12px;font-size:17px}
#ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#ctl button{font:inherit;font-size:20px;min-width:54px;height:46px;border-radius:8px;border:2px solid #0c1015;background:#33465c;color:var(--fg);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
#ctl button:active{background:#4b6684}
#ctl #mode{font-size:15px;padding:0 12px;background:var(--gold);color:var(--ink)}
kbd{display:inline-block;min-width:22px;padding:2px 6px;margin:0 2px;border:1px solid #0c1015;border-bottom-width:3px;border-radius:5px;background:#f4f1ea;color:#1b2430;font:700 12px/1.2 "Trebuchet MS",system-ui,sans-serif;text-align:center}
#keys{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;max-width:900px;font-size:13px}
#keys span{white-space:nowrap}
#ctl button kbd{font-size:11px;vertical-align:middle;margin-left:4px}
#wrap.fsx{max-width:none;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
#wrap.fsx canvas{width:min(100vw,calc(100vh*5/3));border:0;border-radius:0}
#wrap.fsx.px{position:fixed;inset:0;z-index:50}
#ctl.fsc{position:absolute;left:0;right:0;bottom:8px;z-index:5;pointer-events:none}
#ctl.fsc button{pointer-events:auto;opacity:.85}
#wrap:has(.ov.on) #ctl.fsc{display:none}
small{opacity:.8;text-align:center;max-width:760px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* kreskówkowy wygląd menu i okien */
#ov .card{border:4px solid #2a1a0e;border-radius:24px;box-shadow:0 7px 0 #2a1a0e,0 16px 30px rgba(0,0,0,.4);background:linear-gradient(#fffef6,#fff1c4);font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
#ov .card h2{font-size:17px;color:#2a1a0e}
#ov .card h1{font-size:38px;margin:0;line-height:1;color:#ffd84a;-webkit-text-stroke:3px #2a1a0e;paint-order:stroke fill;text-shadow:0 5px 0 #2a1a0e;letter-spacing:1px}
.mh{display:flex;align-items:center;justify-content:center;gap:4px}
.mh img{width:62px;height:auto;flex:none}.mh img.fl{transform:scaleX(-1)}
.sub{margin:8px 0 2px!important;font-size:14px;opacity:.85}
#ov .card button{border:3px solid #2a1a0e;border-radius:14px;box-shadow:0 4px 0 #2a1a0e;transition:transform .08s,box-shadow .08s}
#ov .card button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 #2a1a0e}
#ov .card button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #2a1a0e}
#ov .card button.g{background:#ffb347;color:#2a1a0e;font-weight:700}
#ov .card button.lv{box-shadow:none;border:0;border-top:2px solid rgba(42,26,14,.25);border-radius:0;background:#fffdf5;font-weight:700;transform:none}
#ov .card button.lv:hover:not(:disabled){transform:none;box-shadow:none;background:#fff0b8}
details.grp{border:3px solid #2a1a0e;border-radius:18px;box-shadow:0 4px 0 #2a1a0e;margin:10px 0}
details.grp summary{font-weight:800;color:#2a1a0e}
details.grp[data-l="A1"] summary{background:#8be36a}
details.grp[data-l="A2"] summary{background:#ffc247}
details.grp[data-l="B1"] summary{background:#ff8a7a}
details.grp[data-l="Własne"] summary{background:#b9a7ff}
.lv span:last-child{color:#f2a200;-webkit-text-stroke:.6px #2a1a0e}
#ov .card *{box-sizing:border-box}
#ov .card{padding:12px 14px}
details.grp{margin:8px 0}
details.grp summary{padding:8px 12px}
details.grp .lv{padding:7px 12px;font-size:16px}
#ov .card button.g{font-size:14px;padding:7px 10px;margin:4px 2px}
@media (max-width:700px){.ov:not(.b){position:fixed;z-index:60}}
.mh img{width:56px}
/* ===== portal ===== */
[hidden]{display:none!important}
#pt{width:100%;max-width:960px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#pt .brand{font:800 24px/1 "Arial Rounded MT Bold","Trebuchet MS",sans-serif;color:#ffd84a;-webkit-text-stroke:2px #2a1a0e;paint-order:stroke fill;text-shadow:0 3px 0 #2a1a0e;margin-right:auto}
.nb{font:700 14px "Arial Rounded MT Bold","Trebuchet MS",sans-serif;padding:8px 13px;border:3px solid #2a1a0e;border-radius:14px;background:#fff;color:#2a1a0e;box-shadow:0 3px 0 #2a1a0e;cursor:pointer}
.nb:hover{transform:translateY(-1px)}.nb.on{background:#ffd84a}
#pt .fire{font-weight:700;background:#2a1a0e;border-radius:12px;padding:6px 10px}
.pv{width:100%;max-width:960px;display:block;color:var(--fg);font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
#v-game{width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center;gap:10px;margin:auto 0}
.pv h2{margin:14px 0 8px;font-size:22px}.pv h3{margin:18px 0 8px;font-size:18px}
.hero{background:linear-gradient(135deg,#4c98e2,#8be36a);border:4px solid #2a1a0e;border-radius:24px;box-shadow:0 6px 0 #2a1a0e;padding:16px 20px;color:#10202e}
.hero h2{margin:0 0 4px}.hero p{margin:0;font-weight:600}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat,.wod,.gc,.panel{background:#fffdf5;color:#2a1a0e;border:3px solid #2a1a0e;border-radius:20px;box-shadow:0 5px 0 #2a1a0e}
.stat{padding:10px 12px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:12px;opacity:.8}
.wod{padding:12px 16px;margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.wod h3{margin:0;width:100%;font-size:14px;opacity:.7}.wod .wd{font-size:22px}.wod i{flex:1;min-width:180px}
.wod button{font-size:18px;border:3px solid #2a1a0e;border-radius:12px;background:#ffb347;cursor:pointer;padding:4px 10px;box-shadow:0 3px 0 #2a1a0e}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gc{padding:14px;position:relative;display:flex;flex-direction:column;gap:6px}
.gc .em{font-size:42px;line-height:1}.gc h4{margin:0;font-size:19px}.gc p{margin:0;font-size:13px;flex:1}
.gc.soon{opacity:.62;filter:grayscale(.5)}
.gc .tag{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;background:#8be36a;border:2px solid #2a1a0e;border-radius:10px;padding:2px 7px}
.gc.soon .tag{background:#ddd}
.gc button{font:800 15px "Arial Rounded MT Bold","Trebuchet MS",sans-serif;padding:9px;border:3px solid #2a1a0e;border-radius:14px;background:#ffd84a;cursor:pointer;box-shadow:0 4px 0 #2a1a0e;color:#2a1a0e}
.gc button:hover{transform:translateY(-2px)}.gc button:disabled{background:#e5e5e5;cursor:default;box-shadow:none;transform:none}
.panel{padding:12px 16px;margin-top:10px}.panel h4{margin:0 0 8px}
.bar2{display:flex;height:12px;background:#e3e3e3;border-radius:7px;overflow:hidden;border:2px solid #2a1a0e;margin:4px 0 10px}
.bar2 i{background:#4aa832}.bar2 u{background:#f2b632;text-decoration:none}
.lg{font-size:12px;opacity:.8}
@media (max-width:560px){.stats3{grid-template-columns:1fr}}
.panel label{display:block;margin:10px 0 3px;font-weight:700;font-size:14px}
.panel input[type=text],.panel input[type=password]{width:100%;padding:10px 12px;font:inherit;font-size:16px;border:3px solid #2a1a0e;border-radius:12px;background:#fff;color:#2a1a0e}
.panel label.ck{font-weight:400;display:flex;gap:8px;align-items:flex-start;font-size:13px}
.panel label.ck input{margin-top:3px}
.gbtn{font:800 16px "Arial Rounded MT Bold","Trebuchet MS",sans-serif;padding:10px 18px;border:3px solid #2a1a0e;border-radius:14px;background:#ffd84a;color:#2a1a0e;box-shadow:0 4px 0 #2a1a0e;cursor:pointer}
.gbtn:hover{transform:translateY(-2px)}.gbtn:disabled{opacity:.6;cursor:default;transform:none}
#au-m{min-height:20px;margin:8px 0;font-weight:700;color:#c0392b}#au-m.ok{color:#2e7d32}
.panel textarea,.panel select{width:100%;padding:10px 12px;font:inherit;font-size:15px;border:3px solid #2a1a0e;border-radius:12px;background:#fff;color:#2a1a0e}
.panel textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:150px}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 0;border-top:2px solid rgba(42,26,14,.15)}
.crow .ct{flex:1;min-width:160px}.crow .nb{padding:6px 10px;font-size:13px}
.tag2{font-size:11px;font-weight:800;border:2px solid #2a1a0e;border-radius:9px;padding:1px 6px;background:#ffe28a;margin-left:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row2{grid-template-columns:1fr}}
#tc-m{min-height:20px;margin:8px 0;font-weight:700;color:#c0392b}#tc-m.ok{color:#2e7d32}
/* ===== portal v2: jasny, szkolny, nowoczesny ===== */
:root{color-scheme:light;--pg:#eef2f8;--ink:#16233b;--mut:#5a6784;--line:#dbe2ee;--pri:#2457d6;--pri-d:#1b44ab;--pri-t:#e6edfc;--amb:#f2a516;--amb-t:#fdf1d6;--grn:#178a5b;--grn-t:#dff3ea;--red:#cf3f4b;--sf:#fff}
body{background:var(--pg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;gap:12px;padding:12px 12px 28px}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.i.f{fill:currentColor;stroke:none}
#pt{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:8px 10px;gap:4px}
#pt .brand{display:flex;align-items:center;gap:10px;font:800 21px/1 "Figtree",system-ui,sans-serif;color:var(--ink);-webkit-text-stroke:0;text-shadow:none;letter-spacing:-.3px;margin-right:auto}
#pt .brand b{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--pri);color:#fff;font-size:18px}
.nb{display:inline-flex;align-items:center;gap:7px;font:700 14px "Figtree",system-ui,sans-serif;padding:8px 13px;border:1px solid var(--line);border-radius:10px;background:var(--sf);color:var(--ink);box-shadow:none;cursor:pointer;transition:background .15s,border-color .15s}
.nb:hover{transform:none;background:var(--pri-t);border-color:#c3d2f5}
.nb.on{background:var(--pri-t);border-color:#c3d2f5;color:var(--pri-d)}
#pt .nb{border-color:transparent;background:transparent;color:var(--mut)}
#pt .nb:hover{background:var(--pg);color:var(--ink)}
#pt .nb.on{background:var(--pri-t);color:var(--pri-d)}
#pt .fire{display:inline-flex;align-items:center;gap:5px;font-weight:800;background:var(--amb-t);color:#8a5a00;border-radius:10px;padding:7px 11px;margin-left:4px}
.pv{color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
.pv h2{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-size:24px;font-weight:800;letter-spacing:-.4px}
.pv h3{margin:26px 0 10px;font-size:17px;font-weight:800}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:6px;background:var(--pri);border:0;border-radius:20px;box-shadow:none;padding:28px 30px;color:#fff}
.hero h2{display:block;margin:0 0 6px;font-size:30px;letter-spacing:-.6px;color:#fff}
.hero p{margin:0;max-width:34ch;font-weight:500;font-size:16px;line-height:1.5;color:#dbe6ff}
.tiles{display:flex;align-items:flex-end;gap:7px;flex:none}
.tiles i{display:grid;place-items:center;width:46px;height:46px;border-radius:10px;background:#fff;color:var(--pri);font:800 24px/1 "Figtree",system-ui,sans-serif;font-style:normal;border-bottom:5px solid #b9c9f3}
.tiles i:nth-child(2){margin-bottom:12px}.tiles i:nth-child(3){margin-bottom:24px}.tiles i:nth-child(4){margin-bottom:36px;background:var(--amb);color:#4a2f00;border-bottom-color:#c98100}
@media(max-width:640px){.hero{padding:22px 20px}.tiles{display:none}}
.stat,.wod,.gc,.panel{background:var(--sf);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:none}
.stats3{gap:12px;margin-top:12px}
.stat{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;align-content:center;padding:14px 16px;text-align:left}
.stat .ib{grid-row:1/3;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;font-size:21px}
.stat .ib.a{background:var(--amb-t);color:#b87400}.stat .ib.p{background:var(--pri-t);color:var(--pri)}.stat .ib.g{background:var(--grn-t);color:var(--grn)}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.1}.stat span{font-size:13px;color:var(--mut);opacity:1}
.stat .bar2{grid-column:1/3;margin:8px 0 0}
.wod{padding:16px 20px;margin-top:12px;gap:6px 16px}
.wod h3{margin:0;width:100%;font-size:13px;font-weight:700;color:var(--mut);opacity:1}
.wod .wd{font-size:24px}.wod .wd b{color:var(--pri)}.wod i{color:var(--mut)}
.wod button{display:grid;place-items:center;width:42px;height:42px;font-size:19px;border:1px solid var(--line);border-radius:12px;background:var(--pri-t);color:var(--pri);cursor:pointer;box-shadow:none;padding:0}
.wod button:hover{background:#d5e1fb}
.cards{gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.gc{padding:18px;gap:8px}
.gc .em{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--pri-t);color:var(--pri);font-size:26px;margin-bottom:4px}
.gc h4{font-size:18px;font-weight:800}.gc p{font-size:14px;line-height:1.5;color:var(--mut)}
.gc.soon{opacity:1;filter:none}.gc.soon .em{background:var(--pg);color:#8a95ad}.gc.soon h4{color:#6b7791}
.gc .tag{top:16px;right:16px;font-size:12px;font-weight:700;background:var(--grn-t);color:var(--grn);border:0;border-radius:999px;padding:3px 10px}
.gc.soon .tag{background:var(--pg);color:var(--mut)}
.gc button,.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15px "Figtree",system-ui,sans-serif;padding:11px 18px;border:0;border-radius:10px;background:var(--pri);color:#fff;box-shadow:none;cursor:pointer;transition:background .15s}
.gc button:hover,.gbtn:hover{transform:none;background:var(--pri-d)}
.gc button:disabled{background:var(--pg);color:#8a95ad;box-shadow:none}
.gbtn:disabled{opacity:.6}
.panel{padding:18px 20px;margin-top:12px}.panel h4{margin:0 0 10px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.bar2{height:8px;background:#e6ebf4;border:0;border-radius:4px;margin:6px 0 12px}
.bar2 i{background:var(--grn)}.bar2 u{background:var(--amb)}
.lg{font-size:13px;color:var(--mut);opacity:1}
.panel label{margin:12px 0 4px;font-weight:700;font-size:14px}
.panel input[type=text],.panel input[type=password],.panel textarea,.panel select{border:1px solid #c5cfe1;border-radius:10px;background:#fff;color:var(--ink);font-family:inherit}
.panel input[type=text],.panel input[type=password],.panel select{padding:10px 12px;font-size:16px}
.panel textarea{font-family:ui-monospace,Menlo,Consolas,monospace}
.panel input:focus,.panel textarea:focus,.panel select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-t)}
#au-m,#tc-m{color:var(--red);font-weight:600}#au-m.ok,#tc-m.ok{color:var(--grn)}
.crow{border-top:1px solid var(--line)}
.tag2{border:0;border-radius:999px;padding:2px 9px;background:var(--pri-t);color:var(--pri-d);font-weight:700}
.nb.dng{color:var(--red)}.nb.dng:hover{background:#fbe9eb;border-color:#f0c3c8}
.chk{display:flex;gap:10px;align-items:center;padding:3px 0}.chk .i{color:var(--grn)}.chk.no .i{color:#a9b3c8}.chk.no{color:var(--mut)}
/* pod grą */
canvas{border:1px solid #c5cfe1;border-radius:14px;box-shadow:0 8px 24px rgba(22,35,59,.12)}
#ctl button{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 15px "Figtree",system-ui,sans-serif;border:1px solid var(--line);border-radius:12px;background:var(--sf);color:var(--ink)}
#ctl button:active{background:var(--pri-t)}
#ctl #mode{background:var(--amb-t);color:#6b4500;border-color:#f0d9a0}
kbd{background:#fff;border:1px solid #c5cfe1;border-bottom-width:2px;color:var(--ink);font-family:"Figtree",system-ui,sans-serif}
#keys,small{color:var(--mut);opacity:1}
@media(max-width:560px){#pt .nb .t{display:none}#pt .nb{padding:9px 11px}}
</style>
</head>

  $('v-auth').innerHTML='<div class="panel" style="max-width:460px;margin:18px auto"><h2 style="margin:0 0 12px">'+ic(reg?'userplus':'login')+(reg?'Nowe konto':'Logowanie')+'</h2>'
  +'<div style="display:flex;gap:8px;margin-bottom:6px"><button class="nb'+(reg?'':' on')+'" onclick="setTab(\'login\')">Mam konto</button><button class="nb'+(reg?' on':'')+'" onclick="setTab(\'reg\')">Załóż konto</button></div>'
  +(sb?'':'<p style="color:#c0392b;font-weight:700">Brak połączenia z serwerem. Możesz grać bez konta – postępy zapiszą się w tej przeglądarce.</p>')
  +'<label for="au-n">Nick</label><input id="au-n" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="16">'
  +'<label for="au-p">Hasło</label><input id="au-p" type="password" autocomplete="'+(reg?'new-password':'current-password')+'">'
  +(reg?'<label for="au-p2">Powtórz hasło</label><input id="au-p2" type="password" autocomplete="new-password"><label class="ck"><input type="checkbox" id="au-ok"><span>Nie podaję imienia i nazwiska. Jeśli mam mniej niż 16 lat, mam zgodę rodzica lub opiekuna.</span></label><p class="lg" style="margin:8px 0">Nick: 3–16 znaków (małe litery, cyfry i _). Hasło: co najmniej 6 znaków. Zapamiętaj je – gdy je zapomnisz, poproś nauczyciela o reset. Postępy zrobione bez konta w tej przeglądarce zostaną przeniesione na nowe konto.</p>':'')
  +'<p id="au-m"></p><button class="gbtn" id="au-go" onclick="'+(reg?'doRegister()':'doLogin()')+'">'+(reg?'Utwórz konto':'Zaloguj się')+'</button> <button class="nb" onclick="show(\'home\')">Graj bez konta</button></div>';
  const f=$('au-p'+(reg?'2':''));if(f)f.onkeydown=e=>{if(e.keyCode===13)(reg?doRegister:doLogin)()};
}
async function afterLogin(user,prev){
  await loadBank();await loadUser(user,prev);
  start(0);menu();show('home');
}
async function doLogin(){
  const n=$('au-n').value.trim().toLowerCase(),p=$('au-p').value;
  if(!sb)return amsg('Brak połączenia z serwerem.');
  if(!nickOK(n)||!p)return amsg('Wpisz nick i hasło.');
  $('au-go').disabled=true;amsg('Loguję…',1);
  try{const r=await sb.auth.signInWithPassword({email:mailOf(n),password:p});if(r.error)throw r.error;await afterLogin(r.data.user,null)}
  catch(e){amsg(errPL(e));const b=$('au-go');if(b)b.disabled=false}
}
async function doRegister(){
  const n=$('au-n').value.trim().toLowerCase(),p=$('au-p').value,p2=$('au-p2').value;
  if(!sb)return amsg('Brak połączenia z serwerem.');
  if(!nickOK(n))return amsg('Nick: 3–16 znaków, tylko małe litery, cyfry i _ (bez polskich liter i spacji).');
  if(p.length<6)return amsg('Hasło musi mieć co najmniej 6 znaków.');
  if(p!==p2)return amsg('Hasła nie są takie same.');
  if(!$('au-ok').checked)return amsg('Zaznacz zgodę, aby założyć konto.');
  $('au-go').disabled=true;amsg('Tworzę konto…',1);
  const guest=JSON.parse(JSON.stringify(SV));
  try{
    const r=await sb.auth.signUp({email:mailOf(n),password:p,options:{data:{nickname:n}}});if(r.error)throw r.error;
    let user=r.data.user,sess=r.data.session;
    if(!sess){const l=await sb.auth.signInWithPassword({email:mailOf(n),password:p});if(l.error)throw{message:'confirm'};user=l.data.user}
    await loadBank();U={id:user.id,nick:n};await importGuest(guest);await afterLogin(user,guest);
  }catch(e){amsg(errPL(e));const b=$('au-go');if(b)b.disabled=false}
}
async function logout(){
  try{await sb.auth.signOut()}catch(e){}
  U=null;ROLE='student';SKEY='wc2';try{SV=JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){SV={}}SV.m=SV.m||{};
  await loadBank();start(0);menu();show('home');
}
function dbList(){
  if(!U||ROLE!=='teacher')return'<p class="lg" style="font-size:12px;margin:10px 0">'+(U?'':'Zaloguj się kontem nauczyciela, aby zapisywać kategorie w bazie dla wszystkich uczniów.')+'</p>';
  const mine=CATS.filter(c=>c.own&&c.own===U.id);
  return'<h2>☁️ Moje kategorie w bazie</h2>'+(mine.length?mine.map(c=>'<p>'+c.e+' '+c.n+' ('+c.w.length+') <button class="g" onclick="delCatDB('+c.id+')">Usuń</button></p>').join(''):'<p>Brak – dodaj pierwszą powyżej (zapisze się w bazie dla wszystkich uczniów).</p>');
}
async function saveCatDB(c){
  const am=document.getElementById('am');if(am)am.textContent='Zapisuję w bazie…';
  try{
    const r=await sb.from('categories').insert({slug:'u-'+U.id.slice(0,6)+'-'+Date.now().toString(36),name:c.n,emoji:c.e,is_public:true,owner:U.id,sort:100}).select('id').single();
    if(r.error)throw r.error;
    const seen=new Set(),rows=[];c.w.forEach(w=>{const k=w[0]+'='+w[1];if(!seen.has(k)){seen.add(k);rows.push({category_id:r.data.id,pl:w[0],en:w[1],sentence:w[2]||null})}});
    const q=await sb.from('words').insert(rows);if(q.error)throw q.error;
    await loadBank();adm2('Zapisano w bazie: '+c.n);
  }catch(e){adm2('Błąd zapisu: '+(e&&e.message||'sieć'))}
}
async function delCatDB(id){try{await sb.from('categories').delete().eq('id',id);await loadBank();adm2('Usunięto kategorię')}catch(e){adm2('Błąd usuwania')}}
/* ===== PANEL NAUCZYCIELA (w portalu) ===== */
let tEdit=null,tDel=null;
const L4=[['','Własne (bez poziomu)'],['A1','A1'],['A2','A2'],['B1','B1']];
function tmsg(t,ok){const e=$('tc-m');if(e){e.textContent=t;e.className=ok?'ok':''}}
function parseWords(txt){
  const w=[],seen=new Set();let bad=0;
  String(txt).split(/\r?\n/).forEach(line=>{
    if(!line.trim())return;
    const sep=line.includes('\t')?'\t':line.includes(';')?';':'=';
    const f=line.split(sep).map(x=>cl(x,120));
    if(f.length<2||!f[0]||!f[1]){bad++;return}
    const a=[f[0].slice(0,40),f[1].slice(0,40),f[2]&&f[2].includes('___')?f[2]:'',f[3]?f[3].slice(0,40):''];
    const k=a[0]+'='+a[1];if(seen.has(k))return;seen.add(k);w.push(a);
  });
  return{w:w.slice(0,300),bad};
}
function wordsToText(c){return c.w.map(w=>w.slice(0,4).join('=').replace(/=+$/,'')).join('\n')}
function renderTeach(){
  const root=$('v-teach');
  if(!sb){root.innerHTML='<h2>'+ic('tool')+'Panel nauczyciela</h2><div class="panel">Brak połączenia z serwerem. Panel działa tylko po połączeniu z bazą.</div>';return}
  if(!U){root.innerHTML='<h2>'+ic('tool')+'Panel nauczyciela</h2><div class="panel"><p>Zaloguj się, aby wejść do panelu nauczyciela.</p><button class="gbtn" onclick="goAuth(0)">Zaloguj się</button> <button class="nb" onclick="goAuth(1)">Załóż konto</button></div>';return}
  if(ROLE!=='teacher'){root.innerHTML='<h2>'+ic('tool')+'Panel nauczyciela</h2><div class="panel"><p>Twoje konto (<b>'+U.nick+'</b>) nie ma jeszcze uprawnień nauczyciela. Wpisz kod nauczyciela, który dostałeś od administratora.</p><label for="tc-code">Kod nauczyciela</label><input id="tc-code" type="text" autocomplete="off" autocapitalize="characters" style="max-width:320px"><p id="tc-m"></p><button class="gbtn" onclick="claimTeacher()">Aktywuj</button></div>';return}
  const mine=CATS.filter(c=>c.own&&c.own===U.id),e=tEdit&&mine.find(c=>c.id===tEdit);
  root.innerHTML='<h2>'+ic('tool')+'Panel nauczyciela</h2>'
  +'<div class="panel"><h4>Moje kategorie ('+mine.length+')</h4>'+(mine.length?mine.map(c=>'<div class="crow"><span class="ct">'+c.e+' <b>'+c.n+'</b> <span class="lg">'+c.w.length+' słówek</span>'+(c.l?'<span class="tag2">'+c.l+'</span>':'')+(c.pub===false?'<span class="tag2" style="background:#ddd">ukryta</span>':'')+'</span><button class="nb" onclick="tStart('+c.id+')">'+ic('edit')+'Edytuj</button><button class="nb" onclick="tPub('+c.id+')">'+(c.pub===false?ic('eye')+'Pokaż uczniom':ic('eyeoff')+'Ukryj')+'</button><button class="nb dng" onclick="tDelete('+c.id+')">'+(tDel===c.id?ic('alert')+'Na pewno usunąć?':ic('trash')+'Usuń')+'</button></div>').join(''):'<p class="lg">Nie masz jeszcze własnych kategorii. Dodaj pierwszą poniżej.</p>')+'</div>'
  +'<div class="panel"><h4>'+(e?ic('edit')+'Edycja: '+e.n:ic('plus')+'Nowa kategoria')+'</h4>'
  +'<div class="row2"><div><label for="tc-n">Nazwa</label><input id="tc-n" type="text" maxlength="40"></div><div><label for="tc-e">Emoji</label><input id="tc-e" type="text" maxlength="4" placeholder="📚"></div></div>'
  +'<div class="row2"><div><label for="tc-l">Poziom</label><select id="tc-l">'+L4.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div><div><label class="ck" style="margin-top:34px"><input type="checkbox" id="tc-nh"><span>Ukryj tłumaczenie przy zdaniach z luką (trudniej)</span></label></div></div>'
  +'<label for="tc-w">Słówka – jedno w linii</label><textarea id="tc-w" spellcheck="false" placeholder="polskie=angielskie=zdanie z luką ___ (opcjonalnie)&#10;samolot=plane=I travel by ___.&#10;statek=ship=A ___ sails across the sea."></textarea>'
  +'<p class="lg" style="margin:6px 0">Format: <b>polskie = angielskie = zdanie</b> (zdanie jest opcjonalne i musi zawierać <b>___</b> w miejscu luki). Możesz też wkleić wiersze z Excela lub Arkuszy Google (kolumny rozdzielone tabulatorem lub średnikiem). Minimum 4 słówka.</p>'
  +'<p id="tc-m"></p><button class="gbtn" onclick="tSave()">'+(e?'Zapisz zmiany':'Zapisz kategorię')+'</button> '+(e?'<button class="nb" onclick="tCancel()">Anuluj edycję</button>':'')+'</div>';
  if(e){$('tc-n').value=e.n;$('tc-e').value=e.e;$('tc-l').value=e.l||'';$('tc-nh').checked=!!e.nh;$('tc-w').value=wordsToText(e)}
}
async function claimTeacher(){
  const code=$('tc-code').value.trim();if(!code)return tmsg('Wpisz kod.');
  tmsg('Sprawdzam…',1);
  try{const r=await sb.rpc('claim_teacher',{code});if(r.error)throw r.error;
    if(r.data===true){ROLE='teacher';show('teach')}else tmsg('Nieprawidłowy kod.')}
  catch(e){tmsg('Nie udało się. Spróbuj ponownie.')}
}
function tStart(id){tEdit=id;tDel=null;renderTeach();window.scrollTo(0,document.body.scrollHeight)}
function tCancel(){tEdit=null;renderTeach()}
async function tPub(id){const c=CATS.find(x=>x.id===id);if(!c)return;try{await sb.from('categories').update({is_public:c.pub===false}).eq('id',id);await loadBank();renderTeach()}catch(e){}}
async function tDelete(id){
  if(tDel!==id){tDel=id;renderTeach();return}
  try{await sb.from('categories').delete().eq('id',id);tDel=null;if(tEdit===id)tEdit=null;await loadBank();renderTeach()}catch(e){tmsg('Nie udało się usunąć.')}
}
async function tSave(){
  const name=cl($('tc-n').value,40),emoji=cl($('tc-e').value,4)||'📚',level=$('tc-l').value||null,nh=$('tc-nh').checked,pw=parseWords($('tc-w').value);
  if(!name)return tmsg('Podaj nazwę kategorii.');
  if(pw.w.length<4)return tmsg('Potrzeba co najmniej 4 poprawnych słówek (polskie=angielskie).');
  tmsg('Zapisuję w bazie…',1);
  try{
    const old=tEdit&&CATS.find(c=>c.id===tEdit);
    if(old){
      const u=await sb.from('categories').update({name,emoji,level,no_hint:nh}).eq('id',old.id);if(u.error)throw u.error;
      const have=new Map(old.w.map(w=>[w[0]+'='+w[1],w])),want=new Map(pw.w.map(w=>[w[0]+'='+w[1],w]));
      const del=[...have].filter(([k])=>!want.has(k)).map(([,w])=>w[4]);
      if(del.length){const d=await sb.from('words').delete().in('id',del);if(d.error)throw d.error}
      for(const [k,w] of want){const h=have.get(k);if(h&&((h[2]||'')!==w[2]||(h[3]||'')!==w[3])){const q=await sb.from('words').update({sentence:w[2]||null,trap:w[3]||null}).eq('id',h[4]);if(q.error)throw q.error}}
      const add=[...want].filter(([k])=>!have.has(k)).map(([,w])=>({category_id:old.id,pl:w[0],en:w[1],sentence:w[2]||null,trap:w[3]||null}));
      if(add.length){const q=await sb.from('words').insert(add);if(q.error)throw q.error}
      tEdit=null;
    }else{
      const r=await sb.from('categories').insert({slug:'u-'+U.id.slice(0,6)+'-'+Date.now().toString(36),name,emoji,level,no_hint:nh,is_public:true,owner:U.id,sort:100}).select('id').single();if(r.error)throw r.error;
      const q=await sb.from('words').insert(pw.w.map(w=>({category_id:r.data.id,pl:w[0],en:w[1],sentence:w[2]||null,trap:w[3]||null})));if(q.error)throw q.error;
    }
    await loadBank();renderTeach();tmsg('Zapisano w bazie: '+name+(pw.bad?' (pominięto '+pw.bad+' błędnych linii)':''),1);
  }catch(e){tmsg('Błąd zapisu: '+((e&&e.message)||'sieć'))}
}
start(0);menu();
let last=performance.now(),acc=0;
(function loop(now){
  if(view!=='game'){last=now;acc=0;requestAnimationFrame(loop);return}
  try{
    acc+=Math.max(0,Math.min(now-last,100));last=now;
    let n=0;while(acc>=1000/60&&n++<4){try{update()}catch(e){console.error(e)}acc-=1000/60}
    if(n>=4)acc=0;
    if(!isFinite(p.x+p.y)){p.x=2*T;p.y=hs[2]*T-p.h;p.vx=p.vy=0}
    draw();
  }catch(e){console.error(e)}
  requestAnimationFrame(loop);
})(last);
show('home');initCloud();
</script>
